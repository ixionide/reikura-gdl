[workspace]
members = ["reikura_app", "reikura_gdl", "reikura_util"]
resolver = "3"

[workspace.dependencies]
reikura_app = { path = "reikura_app" }
reikura_gdl = { path = "reikura_gdl" }
reikura_util = { path = "reikura_util" }

anyhow = "1.0"
memmap2 = "0.9.10"
winit = "0.31.0-beta.2"

[workspace.lints.clippy]
new_without_default = "allow"
